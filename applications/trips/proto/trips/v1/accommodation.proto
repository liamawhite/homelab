syntax = "proto3";

package trips.v1;

option go_package = "github.com/liamawhite/trips/gen/trips/v1;tripsv1";

import "google/protobuf/timestamp.proto";

message Accommodation {
  string id = 1;
  string trip_id = 2;
  string name = 3;
  string location = 4;
  // YYYY-MM-DD.
  string check_in = 5;
  // YYYY-MM-DD.
  string check_out = 6;
  google.protobuf.Timestamp created_at = 7;
  // Optional link to the booking (e.g. the hotel's confirmation/manage-
  // booking page).
  string confirmation_link = 8;
  // Optional booking/confirmation code.
  string booking_number = 9;
}

message ListAccommodationsRequest {
  string trip_id = 1;
}

message ListAccommodationsResponse {
  repeated Accommodation accommodations = 1;
}

message AddAccommodationRequest {
  string trip_id = 1;
  string name = 2;
  string location = 3;
  string check_in = 4;
  string check_out = 5;
  // Optional - see Accommodation.confirmation_link/booking_number.
  string confirmation_link = 6;
  string booking_number = 7;
}

message AddAccommodationResponse {
  Accommodation accommodation = 1;
}

message DeleteAccommodationRequest {
  string id = 1;
}

message DeleteAccommodationResponse {}

message UpdateAccommodationConfirmationRequest {
  string id = 1;
  string confirmation_link = 2;
  string booking_number = 3;
}

message UpdateAccommodationConfirmationResponse {
  Accommodation accommodation = 1;
}

service AccommodationService {
  rpc ListAccommodations(ListAccommodationsRequest) returns (ListAccommodationsResponse);
  rpc AddAccommodation(AddAccommodationRequest) returns (AddAccommodationResponse);
  rpc DeleteAccommodation(DeleteAccommodationRequest) returns (DeleteAccommodationResponse);
  rpc UpdateAccommodationConfirmation(UpdateAccommodationConfirmationRequest) returns (UpdateAccommodationConfirmationResponse);
}
