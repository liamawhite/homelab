syntax = "proto3";

package reminders.v1;

option go_package = "github.com/liamawhite/reminders/gen/reminders/v1;remindersv1";

import "google/protobuf/timestamp.proto";
import "reminders/v1/one_off_item.proto";

enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_SUNDAY = 1;
  WEEKDAY_MONDAY = 2;
  WEEKDAY_TUESDAY = 3;
  WEEKDAY_WEDNESDAY = 4;
  WEEKDAY_THURSDAY = 5;
  WEEKDAY_FRIDAY = 6;
  WEEKDAY_SATURDAY = 7;
}

message WeeklyRule {
  // Required - at least one day.
  repeated Weekday days_of_week = 1;
}

message MonthlyRule {
  // Required - at least one day, each 1-31. Days beyond the end of a given
  // month are clamped to that month's last day.
  repeated int32 days_of_month = 1;
}

message MonthDay {
  int32 month = 1; // 1-12
  int32 day = 2;   // 1-31; clamped to the month's last valid day.
}

message YearlyRule {
  // Required - at least one date.
  repeated MonthDay dates = 1;
}

message IntervalRule {
  // Required - must be >= 1.
  int32 interval_days = 1;
}

message RecurrenceRule {
  oneof rule {
    WeeklyRule weekly = 1;
    MonthlyRule monthly = 2;
    YearlyRule yearly = 3;
    IntervalRule interval = 4;
  }
}

message RecurringItem {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
  string notes = 4;
  // Always set - unlike OneOffItem.due_date, a recurring item always has a
  // next occurrence.
  google.protobuf.Timestamp next_due_date = 5;
  Area area = 6;
  RecurrenceRule rule = 7;
}

message ListRecurringItemsRequest {}

message ListRecurringItemsResponse {
  repeated RecurringItem items = 1;
}

message CreateRecurringItemRequest {
  string title = 1;
  string notes = 2;
  // Required - must not be AREA_UNSPECIFIED.
  Area area = 3;
  // Required - exactly one rule variant must be set.
  RecurrenceRule rule = 4;
}

message CreateRecurringItemResponse {
  RecurringItem item = 1;
}

message UpdateRecurringItemNotesRequest {
  string id = 1;
  string notes = 2;
}

message UpdateRecurringItemNotesResponse {
  RecurringItem item = 1;
}

message UpdateRecurringItemAreaRequest {
  string id = 1;
  // Required - must not be AREA_UNSPECIFIED.
  Area area = 2;
}

message UpdateRecurringItemAreaResponse {
  RecurringItem item = 1;
}

message UpdateRecurringItemRuleRequest {
  string id = 1;
  // Required - exactly one rule variant must be set. Replaces the rule
  // wholesale and recomputes next_due_date from today.
  RecurrenceRule rule = 2;
}

message UpdateRecurringItemRuleResponse {
  RecurringItem item = 1;
}

message CompleteRecurringItemRequest {
  string id = 1;
}

message CompleteRecurringItemResponse {
  RecurringItem item = 1;
}

message DeleteRecurringItemRequest {
  string id = 1;
}

message DeleteRecurringItemResponse {}

service RecurringItemService {
  rpc ListRecurringItems(ListRecurringItemsRequest) returns (ListRecurringItemsResponse);
  rpc CreateRecurringItem(CreateRecurringItemRequest) returns (CreateRecurringItemResponse);
  rpc UpdateRecurringItemNotes(UpdateRecurringItemNotesRequest) returns (UpdateRecurringItemNotesResponse);
  rpc UpdateRecurringItemArea(UpdateRecurringItemAreaRequest) returns (UpdateRecurringItemAreaResponse);
  rpc UpdateRecurringItemRule(UpdateRecurringItemRuleRequest) returns (UpdateRecurringItemRuleResponse);
  rpc CompleteRecurringItem(CompleteRecurringItemRequest) returns (CompleteRecurringItemResponse);
  rpc DeleteRecurringItem(DeleteRecurringItemRequest) returns (DeleteRecurringItemResponse);
}
