syntax = "proto3";

package reminders.v1;

option go_package = "github.com/liamawhite/reminders/gen/reminders/v1;remindersv1";

import "google/protobuf/timestamp.proto";

enum Area {
  AREA_UNSPECIFIED = 0;
  AREA_PERSONAL = 1;
  AREA_FAMILY = 2;
  AREA_WORK = 3;
  AREA_PROFESSIONAL = 4;
}

enum OneOffItemStatus {
  ONE_OFF_ITEM_STATUS_UNSPECIFIED = 0;
  ONE_OFF_ITEM_STATUS_OPEN = 1;
  ONE_OFF_ITEM_STATUS_COMPLETED = 2;
}

message OneOffItem {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
  string notes = 4;
  google.protobuf.Timestamp due_date = 5;
  Area area = 6;
  // Always OPEN on creation - see UpdateOneOffItemStatus to complete it.
  OneOffItemStatus status = 7;
}

message ListOneOffItemsRequest {}

message ListOneOffItemsResponse {
  repeated OneOffItem items = 1;
}

message CreateOneOffItemRequest {
  string title = 1;
  google.protobuf.Timestamp due_date = 2;
  // Required - must not be AREA_UNSPECIFIED.
  Area area = 3;
  string notes = 4;
}

message CreateOneOffItemResponse {
  OneOffItem item = 1;
}

message UpdateOneOffItemTitleRequest {
  string id = 1;
  string title = 2;
}

message UpdateOneOffItemTitleResponse {
  OneOffItem item = 1;
}

message UpdateOneOffItemNotesRequest {
  string id = 1;
  string notes = 2;
}

message UpdateOneOffItemNotesResponse {
  OneOffItem item = 1;
}

message UpdateOneOffItemDueDateRequest {
  string id = 1;
  // Absent/unset clears the due date.
  google.protobuf.Timestamp due_date = 2;
}

message UpdateOneOffItemDueDateResponse {
  OneOffItem item = 1;
}

message UpdateOneOffItemAreaRequest {
  string id = 1;
  // Required - must not be AREA_UNSPECIFIED.
  Area area = 2;
}

message UpdateOneOffItemAreaResponse {
  OneOffItem item = 1;
}

message UpdateOneOffItemStatusRequest {
  string id = 1;
  // Required - must not be ONE_OFF_ITEM_STATUS_UNSPECIFIED.
  OneOffItemStatus status = 2;
}

message UpdateOneOffItemStatusResponse {
  OneOffItem item = 1;
}

message DeleteOneOffItemRequest {
  string id = 1;
}

message DeleteOneOffItemResponse {}

service OneOffItemService {
  rpc ListOneOffItems(ListOneOffItemsRequest) returns (ListOneOffItemsResponse);
  rpc CreateOneOffItem(CreateOneOffItemRequest) returns (CreateOneOffItemResponse);
  rpc UpdateOneOffItemTitle(UpdateOneOffItemTitleRequest) returns (UpdateOneOffItemTitleResponse);
  rpc UpdateOneOffItemNotes(UpdateOneOffItemNotesRequest) returns (UpdateOneOffItemNotesResponse);
  rpc UpdateOneOffItemDueDate(UpdateOneOffItemDueDateRequest) returns (UpdateOneOffItemDueDateResponse);
  rpc UpdateOneOffItemArea(UpdateOneOffItemAreaRequest) returns (UpdateOneOffItemAreaResponse);
  rpc UpdateOneOffItemStatus(UpdateOneOffItemStatusRequest) returns (UpdateOneOffItemStatusResponse);
  rpc DeleteOneOffItem(DeleteOneOffItemRequest) returns (DeleteOneOffItemResponse);
}
