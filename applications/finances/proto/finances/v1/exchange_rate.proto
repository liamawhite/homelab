syntax = "proto3";

package finances.v1;

option go_package = "github.com/liamawhite/finances/gen/finances/v1;financesv1";

// GetRates returns the GBP->USD exchange rate for each requested date, so
// the frontend can convert a GBP asset's value into USD (or vice versa) at
// display time. Rates are fetched from a free public API and cached
// server-side in a table (see internal/exchangerate), refreshed once a day
// - this RPC only ever reads that cache, it never calls out live.
message GetRatesRequest {
  repeated string dates = 1; // ISO 8601 "YYYY-MM-DD"
}

message GetRatesResponse {
  // Keyed by the requested date - a date with no exact stored rate falls
  // back to the most recent earlier one (e.g. weekends/holidays have no
  // rate of their own). A date with no rate at all yet (nothing stored on
  // or before it) is simply absent from this map.
  map<string, double> usd_per_gbp_by_date = 1;
}

service ExchangeRateService {
  rpc GetRates(GetRatesRequest) returns (GetRatesResponse);
}
