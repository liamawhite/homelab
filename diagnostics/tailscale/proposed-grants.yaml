# Proposed from initial denied-flow evidence. Not included in Flux or applied live.
# API grant remains pending. Direct chart download was superseded by ADR 0008;
# its former proposal was removed because Flux must use the egress gateway.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-tailscale-operator-api
spec:
  description: Tailscale operator state storage and resource reconciliation through the Kubernetes API.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: tailscale
      k8s:io.cilium.k8s.policy.serviceaccount: operator
  egress:
  - toEntities:
    - kube-apiserver
    # The API on the pod's own control-plane node has the host identity.
    - host
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
