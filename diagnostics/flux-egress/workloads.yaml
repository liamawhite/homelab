  - group: networking.istio.io
    kind: ServiceEntry
    name: cilium-charts
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/flux-egress-verification/sa/client
    to:
    - operation:
        hosts:
        - helm.cilium.io
        - helm.cilium.io:80
        methods:
        - GET
        paths:
        - /index.yaml
  - from:
    - source:
        principals:
        - cluster.local/ns/flux-egress-verification/sa/client
    to:
    - operation:
        hosts:
        - helm.cilium.io
        - helm.cilium.io:80
        methods:
        - GET
        paths:
        - /cilium-1.19.5.tgz
---
