        principals:
        - cluster.local/ns/flux-egress-verification/sa/client
    to:
    - operation:
        hosts:
        - istio-release.storage.googleapis.com
        - istio-release.storage.googleapis.com:80
        methods:
        - GET
        paths:
        - /charts/istiod-1.30.2.tgz
  - from:
    - source:
        principals:
        - cluster.local/ns/flux-egress-verification/sa/client
    to:
    - operation:
        hosts:
        - istio-release.storage.googleapis.com
        - istio-release.storage.googleapis.com:80
        methods:
