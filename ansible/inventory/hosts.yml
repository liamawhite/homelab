all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
      host_os: controller
  children:
    k3s_servers:
      vars:
        ansible_connection: ssh
      hosts:
        pi-0:
          ansible_user: "{{ bootstrap_secrets.nodes | selectattr('name', 'equalto', 'pi-0') | map(attribute='ssh.user') | first }}"
          ansible_password: "{{ bootstrap_secrets.nodes | selectattr('name', 'equalto', 'pi-0') | map(attribute='ssh.password') | first }}"
          ansible_host: 192.168.1.51
          host_os: debian
          k3s_arch: arm64
        pi-1:
          ansible_user: "{{ bootstrap_secrets.nodes | selectattr('name', 'equalto', 'pi-1') | map(attribute='ssh.user') | first }}"
          ansible_password: "{{ bootstrap_secrets.nodes | selectattr('name', 'equalto', 'pi-1') | map(attribute='ssh.password') | first }}"
          ansible_host: 192.168.1.52
          host_os: debian
          k3s_arch: arm64
        nix-gpu-3070-1:
          ansible_host: 192.168.1.60
          ansible_user: liam
          ansible_ssh_private_key_file: "{{ repo_root }}/os/ssh/nix-gpu-3070-1"
          ansible_python_interpreter: /run/current-system/sw/bin/python3
          host_os: nixos
          k3s_arch: amd64
