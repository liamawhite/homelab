- name: Check published source before cluster bootstrap
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require published definitions for the Flux handoff
      ansible.builtin.include_role:
        name: published
      when: enable_flux | bool

- ansible.builtin.import_playbook: access.yml

- name: Bootstrap add-ons and hand ownership to Flux
  hosts: localhost
  connection: local
  gather_facts: false
  roles: [access, addons]
