- ansible.builtin.import_playbook: access.yml

- name: Refresh the default kubeconfig and select homelab
  hosts: localhost
  connection: local
  gather_facts: false
  roles: [access]
  tasks:
    - name: Merge fresh credentials under the stable homelab identity
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ repo_root }}/ansible/tools/merge_kubeconfig.py"
          - "{{ api_kubeconfig }}"
          - "https://{{ cluster_vip }}:6443"
      register: kubeconfig_merge
      changed_when: kubeconfig_merge.stdout == 'updated'

    - name: Report the selected context
      ansible.builtin.debug:
        msg: 'Default kubeconfig ~/.kube/config refreshed; active context: homelab.'
