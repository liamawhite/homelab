- name: Validate the recovery request and published definitions
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require an explicit add-on repair request
      ansible.builtin.assert:
        that: allow_addon_recovery | bool
        fail_msg: "Recovery requires allow_addon_recovery=true. Before handoff rerun phase2."

    - name: Require published agreement before resuming Flux
      ansible.builtin.include_role:
        name: published
      when: resume_gitops | bool

- ansible.builtin.import_playbook: access.yml

- name: Repair add-ons using a direct API and shared definitions
  hosts: localhost
  connection: local
  gather_facts: false
  roles: [access]
  tasks:
    - name: Inspect existing reconciliation objects
      kubernetes.core.k8s_info:
        kubeconfig: "{{ api_kubeconfig }}"
        api_version: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        namespace: flux-system
      register: recovery_kustomizations

    - name: Suspend managed Kustomizations before intervening
      kubernetes.core.k8s:
        kubeconfig: "{{ api_kubeconfig }}"
        definition:
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: flux-system
          spec:
            suspend: true
      loop: "{{ recovery_kustomizations.resources | default([]) | selectattr('metadata.name', 'in', ['flux-system', 'kube-vip', 'cilium', 'network-security', 'istio', 'mesh-security']) | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Inspect foundation Helm releases
      kubernetes.core.k8s_info:
        kubeconfig: "{{ api_kubeconfig }}"
        api_version: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        namespace: flux-system
      register: recovery_helmreleases

    - name: Suspend managed Helm reconciliation
      kubernetes.core.k8s:
        kubeconfig: "{{ api_kubeconfig }}"
        definition:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: flux-system
          spec: {suspend: true}
      loop: "{{ recovery_helmreleases.resources | default([]) | selectattr('metadata.name', 'in', ['cilium', 'istio-base', 'istiod', 'istio-cni', 'ztunnel']) | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Reapply known-good definitions
      ansible.builtin.include_role:
        name: addons

- ansible.builtin.import_playbook: verify.yml
  vars:
    verify_gitops: "{{ resume_gitops | bool }}"
