- name: Require published definitions before migrating enforcement
  hosts: localhost
  connection: local
  gather_facts: false
  roles: [published]
  tasks:
    - name: Read the reviewed administrator allowlist
      ansible.builtin.include_vars:
        file: "{{ cluster_dir }}/flux-system/network-inputs.yaml"
        name: network_inputs
    - name: Refuse migration without an explicit recovery allowlist
      ansible.builtin.assert:
        that: network_inputs.data.ADMIN_CIDRS_IPV4 | from_json | length > 0
        fail_msg: "Set and publish ADMIN_CIDRS_IPV4 before migrating network enforcement."

- ansible.builtin.import_playbook: prepare-nixos.yml
  vars:
    apply_nixos_runtime: true

- name: Migrate only resolver and firewall prerequisites one host at a time
  hosts: k3s_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles: [preflight, host_firewall]
  tasks:
    - name: Read current K3s configuration
      ansible.builtin.slurp:
        src: "{{ k3s_config_path }}"
      register: current_security_config
      no_log: true
    - name: Construct the exact desired configuration
      ansible.builtin.set_fact:
        security_k3s_config: "{{ k3s_config | combine({'cluster-init': true} if inventory_hostname == k3s_seed else {'server': 'https://' + hostvars[k3s_seed].ansible_host + ':6443'}) }}"
      no_log: true
    - name: Permit only the reviewed resolver change
      ansible.builtin.assert:
        that:
          - (current_security_config.content | b64decode | from_yaml | dict2items | rejectattr('key', 'equalto', 'resolv-conf') | list | items2dict) == (security_k3s_config | dict2items | rejectattr('key', 'equalto', 'resolv-conf') | list | items2dict)
      no_log: true
    - name: Write the explicit resolver configuration
      ansible.builtin.copy:
        dest: "{{ k3s_config_path }}"
        content: "{{ security_k3s_config | to_nice_yaml }}"
        mode: "0600"
      register: security_config_written
      no_log: true
    - name: Write the firewall-dependent K3s unit
      ansible.builtin.template:
        src: "{{ repo_root }}/ansible/roles/k3s/templates/k3s.service.j2"
        dest: "{{ k3s_unit_dir }}/k3s.service"
        mode: "0644"
      register: security_unit_written
    - name: Restart K3s only when resolver or boot ordering changed
      ansible.builtin.systemd_service:
        name: k3s
        daemon_reload: "{{ security_unit_written.changed }}"
        state: "{{ 'restarted' if security_config_written.changed or security_unit_written.changed else 'started' }}"
    - name: Require the direct node API to return before continuing
      ansible.builtin.command:
        argv: ["{{ k3s_binary }}", kubectl, --kubeconfig=/etc/rancher/k3s/k3s.yaml, get, --raw=/readyz]
      register: security_api_ready
      retries: 60
      delay: 3
      until: security_api_ready.rc == 0
      changed_when: false

- ansible.builtin.import_playbook: recover.yml
  vars:
    allow_addon_recovery: true
