- ansible.builtin.import_playbook: access.yml

- name: Deliver Tailscale OAuth credentials without deploying resources or changing policy
  hosts: localhost
  connection: local
  gather_facts: false
  roles: [access]
  tasks:
    - name: Require existing operator OAuth credentials
      ansible.builtin.assert:
        that:
          - bootstrap_secrets.tailscale.oauthClientId | length > 0
          - bootstrap_secrets.tailscale.oauthClientSecret | length > 0
        fail_msg: Existing Tailscale operator OAuth credentials are required.
      no_log: true

    - name: Deliver the operator OAuth Secret into the existing Tailscale namespace
      kubernetes.core.k8s:
        kubeconfig: '{{ api_kubeconfig }}'
        apply: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: operator-oauth
            namespace: tailscale
          type: Opaque
          data:
            client_id: '{{ bootstrap_secrets.tailscale.oauthClientId | b64encode }}'
            client_secret: '{{ bootstrap_secrets.tailscale.oauthClientSecret | b64encode }}'
      no_log: true
