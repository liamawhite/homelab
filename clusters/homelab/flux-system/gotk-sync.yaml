apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/liamawhite/homelab.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Child Kustomizations carry their own health gates; the root must not
  # wait for itself because its manifest is part of this reconciliation.
  wait: false
  timeout: 5m
