apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  releaseName: tailscale-operator
  targetNamespace: tailscale
  storageNamespace: tailscale
  timeout: 5m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.102.4
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  driftDetection:
    mode: enabled
  values:
    # Ansible supplies operator-oauth. Never put OAuth values in Helm storage.
    operatorConfig:
      hostname: tailscale-operator
      defaultTags: [tag:k8s-operator]
      extraEnv:
      - name: XDG_CONFIG_HOME
        value: /tmp
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    proxyConfig:
      defaultTags: tag:k8s
      defaultProxyClass: homelab
    apiServerProxyConfig:
      mode: 'false'
      allowImpersonation: 'false'
