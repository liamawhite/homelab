apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: homelab
spec:
  statefulSet:
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tailscaleContainer:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
