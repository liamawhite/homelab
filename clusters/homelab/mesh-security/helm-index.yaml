---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-index
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-index
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm-index
  template:
    metadata:
      labels:
        app: helm-index
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: helm-index
      automountServiceAccountToken: false
      containers:
      - name: index
        image: busybox:1.37.0
        command:
        - httpd
        - -f
        - -p
        - '8080'
        - -h
        - /charts
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
        volumeMounts:
        - name: index
          mountPath: /charts
          readOnly: true
      volumes:
      - name: index
        configMap:
          name: helm-index
---
apiVersion: v1
kind: Service
metadata:
  name: helm-index
  namespace: flux-system
spec:
  selector:
    app: helm-index
  ports:
  - name: http
    port: 8080
    targetPort: 8080
