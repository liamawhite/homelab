apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: github
  namespace: istio-egress
  labels:
    istio.io/use-waypoint: egress
spec:
  hosts:
  - github.com
  location: MESH_EXTERNAL
  ports:
  - number: 80
    name: http
    protocol: HTTP
    targetPort: 443
  resolution: DNS
  exportTo:
  - '*'
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: github-tls
  namespace: istio-egress
spec:
  host: github.com
  exportTo:
  - '*'
  trafficPolicy:
    tls:
      mode: SIMPLE
      sni: github.com
      subjectAltNames:
      - github.com
      insecureSkipVerify: false
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-flux-github
  namespace: istio-egress
spec:
  targetRefs:
  - group: networking.istio.io
    kind: ServiceEntry
    name: github
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/flux-system/sa/source-controller
    to:
    - operation:
        hosts:
        - github.com
        - github.com:80
        methods:
        - GET
        paths:
        - /liamawhite/homelab.git/info/refs
  - from:
    - source:
        principals:
        - cluster.local/ns/flux-system/sa/source-controller
    to:
    - operation:
        hosts:
        - github.com
        - github.com:80
        methods:
        - POST
        paths:
        - /liamawhite/homelab.git/git-upload-pack
---
