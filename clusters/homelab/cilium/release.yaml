apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  timeout: 10m
  chart:
    spec:
      chart: cilium
      version: 1.19.5
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
  driftDetection:
    mode: enabled
  values:
    k8sServiceHost: 192.168.1.50
    k8sServicePort: 6443
    kubeProxyReplacement: true
    routingMode: tunnel
    tunnelProtocol: vxlan
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: [10.42.0.0/16]
    cni:
      exclusive: false
      confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d
      binPath: /var/lib/rancher/k3s/data/cni
    envoy:
      enabled: false
    socketLB:
      hostNamespaceOnly: true
    bpf:
      hostLegacyRouting: true
    operator:
      replicas: 2
