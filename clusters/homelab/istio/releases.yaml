apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    homelab.local/infrastructure: 'true'
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 1h
  # Pinned index rewrites absolute HTTPS chart URLs for mesh TLS origination.
  url: http://helm-index.flux-system.svc.cluster.local:8080
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: flux-system
spec:
  interval: 10m
  releaseName: istio-base
  targetNamespace: istio-system
  storageNamespace: istio-system
  timeout: 10m
  chart:
    spec:
      chart: base
      version: 1.30.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
  driftDetection:
    mode: enabled
  values:
    defaultRevision: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  interval: 10m
  releaseName: istiod
  targetNamespace: istio-system
  storageNamespace: istio-system
  timeout: 10m
  chart:
    spec:
      chart: istiod
      version: 1.30.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
  driftDetection:
    mode: enabled
  values:
    profile: ambient
    meshConfig:
      accessLogFile: /dev/stdout
      accessLogEncoding: JSON
    pilot:
      env:
        PILOT_ENABLE_AMBIENT_WAYPOINTS: 'true'
  dependsOn:
  - name: istio-base
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: flux-system
spec:
  interval: 10m
  releaseName: istio-cni
  targetNamespace: istio-system
  storageNamespace: istio-system
  timeout: 10m
  chart:
    spec:
      chart: cni
      version: 1.30.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
  driftDetection:
    mode: enabled
  values:
    profile: ambient
    cni:
      cniBinDir: /var/lib/rancher/k3s/data/cni
      cniConfDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
      ambient:
        dnsCapture: true
  dependsOn:
  - name: istiod
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: flux-system
spec:
  interval: 10m
  releaseName: ztunnel
  targetNamespace: istio-system
  storageNamespace: istio-system
  timeout: 10m
  chart:
    spec:
      chart: ztunnel
      version: 1.30.2
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
  driftDetection:
    mode: enabled
  values:
    global:
      hub: registry.istio.io/release
  dependsOn:
  - name: istio-cni
