apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      serviceAccountName: kube-vip
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.2.1
          args: [manager]
          env:
            # In-cluster credentials, direct local API: neither the VIP nor
            # ClusterIP routing may exist during bootstrap or recovery.
            - name: KUBERNETES_SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - {name: vip_arp, value: "true"}
            - {name: port, value: "6443"}
            - {name: vip_interface, value: ""}
            - {name: vip_cidr, value: "32"}
            - {name: cp_enable, value: "true"}
            - {name: cp_namespace, value: kube-system}
            - {name: svc_enable, value: "false"}
            - {name: vip_leaderelection, value: "true"}
            - {name: vip_leaseduration, value: "5"}
            - {name: vip_renewdeadline, value: "3"}
            - {name: vip_retryperiod, value: "1"}
            - {name: address, value: 192.168.1.50}
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
