apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-default-deny
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  description: All pods deny ingress and egress unless an explicit grant exists.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  # Cilium rejects empty rule lists. The none entity never matches a peer,
  # activates default deny, and preserves separately declared additive grants.
  ingress:
  - fromEntities: [none]
  egress:
  - toEntities: [none]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-api-kube-system-coredns
spec:
  description: API access for kube-system/coredns.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:io.cilium.k8s.policy.serviceaccount: coredns
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
      - port: '443'
        protocol: TCP
