apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-cluster-dns
spec:
  description: Only explicit DNS clients can query CoreDNS on TCP/UDP 53.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:io.cilium.k8s.policy.serviceaccount: coredns
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:io.cilium.k8s.policy.serviceaccount: metrics-server
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:io.cilium.k8s.policy.serviceaccount: local-path-provisioner-service-account
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: flux-system
        k8s:io.cilium.k8s.policy.serviceaccount: source-controller
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: flux-system
        k8s:io.cilium.k8s.policy.serviceaccount: kustomize-controller
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: flux-system
        k8s:io.cilium.k8s.policy.serviceaccount: helm-controller
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: flux-system
        k8s:io.cilium.k8s.policy.serviceaccount: notification-controller
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: istio-system
        k8s:io.cilium.k8s.policy.serviceaccount: istiod
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: istio-system
        k8s:io.cilium.k8s.policy.serviceaccount: ztunnel
    - matchLabels:
        k8s:homelab.local/dns: allowed
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: istio-egress
        k8s:gateway.networking.k8s.io/gateway-name: egress
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
---
