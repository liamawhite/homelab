apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-flux-egress-gateway
spec:
  description: Flux source-controller reaches only the shared egress waypoint for
    internet downloads.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: flux-system
      k8s:io.cilium.k8s.policy.serviceaccount: source-controller
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: istio-egress
        k8s:io.cilium.k8s.policy.serviceaccount: egress
    toPorts:
    - ports:
      - port: '15008'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-egress-gateway-flux
spec:
  description: The shared egress waypoint accepts Flux source-controller HBONE.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: istio-egress
      k8s:io.cilium.k8s.policy.serviceaccount: egress
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: flux-system
        k8s:io.cilium.k8s.policy.serviceaccount: source-controller
    toPorts:
    - ports:
      - port: '15008'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-egress-gateway-downloads
spec:
  description: Only the egress waypoint reaches approved download origins with TLS
    on TCP 443.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: istio-egress
      k8s:io.cilium.k8s.policy.serviceaccount: egress
  egress:
  - toFQDNs:
    - matchName: github.com
    - matchName: helm.cilium.io
    - matchName: istio-release.storage.googleapis.com
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
      rules:
        dns:
        - matchPattern: '*'
---
