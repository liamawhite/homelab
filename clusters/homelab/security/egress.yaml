apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-ambient-local-source-controller
spec:
  description: Authenticated artifact traffic after ambient local delivery. Link-local
    source is the node ambient delivery path, not internet ingress.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: flux-system
      k8s:io.cilium.k8s.policy.serviceaccount: source-controller
  ingress:
  - fromCIDR:
    - 169.254.7.127/32
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
---
