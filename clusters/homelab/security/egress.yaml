---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-ambient-flux-probes
spec:
  description: Kubelet health probes arrive with the ambient probe SNAT address.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: flux-system
    matchExpressions:
    - key: k8s:io.cilium.k8s.policy.serviceaccount
      operator: In
      values:
      - source-controller
      - helm-controller
      - kustomize-controller
      - notification-controller
  ingress:
  - fromCIDR:
    - 169.254.7.127/32
    toPorts:
    - ports:
      - port: '9440'
        protocol: TCP
