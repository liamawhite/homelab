name: applications / melodical

on:
  pull_request:
    paths:
      - "applications/melodical/**"
      - ".github/workflows/melodical-checks.yml"
      - ".github/workflows/melodical-publish.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: applications/melodical

permissions:
  contents: read

concurrency:
  group: melodical-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: applications/melodical/go.mod
          cache-dependency-path: applications/melodical/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: applications/melodical/web/package-lock.json
      - run: npm ci --prefix web
      - run: make format-check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: applications/melodical/go.mod
          cache-dependency-path: applications/melodical/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: applications/melodical/web/package-lock.json
      - name: Build frontend and prepare embedded assets
        run: make frontend
      - name: Lint TypeScript and React
        run: npm run lint --prefix web
      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: applications/melodical
          version: v2.14.0
          args: ./cmd/... ./internal/... ./web

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: applications/melodical/go.mod
          cache-dependency-path: applications/melodical/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: applications/melodical/web/package-lock.json
      - run: npm ci --prefix web
      - name: Install Chromium and system dependencies
        run: cd web && npx playwright install --with-deps chromium
      - name: Run backend and browser tests
        run: make test test-browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: applications/melodical/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
