name: parental checks

on:
  pull_request:
    paths:
      - "applications/parental/**"
      - ".github/workflows/parental-checks.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: applications/parental

permissions:
  contents: read

concurrency:
  group: parental-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

jobs:
  format:
    name: parental / format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: applications/parental/go.mod
          cache-dependency-path: applications/parental/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: applications/parental/web/package-lock.json
      - run: npm ci --prefix web
      - run: make format-check

  lint:
    name: parental / lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: applications/parental/go.mod
          cache-dependency-path: applications/parental/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: applications/parental/web/package-lock.json
      - name: Build frontend and prepare embedded assets
        run: make frontend
      - name: Lint TypeScript and React
        run: npm run lint --prefix web
      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: applications/parental
          version: v2.14.0
          args: ./cmd/... ./internal/... ./gen/...

  test:
    name: parental / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: applications/parental/go.mod
          cache-dependency-path: applications/parental/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: applications/parental/web/package-lock.json
      - name: Run backend tests
        run: make test
