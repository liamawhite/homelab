name: applications

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: required-app-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required:
    name: applications / required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require checks for changed apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/required-app-checks.py
